name: PR Verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: codebase/requirements.txt

      - name: Install Python dependencies
        working-directory: codebase
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        working-directory: codebase
        run: |
          pytest -q

  frontend-verification:
    name: Frontend Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: codebase/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: codebase/frontend
        run: |
          npm ci

      - name: Run frontend tests
        working-directory: codebase/frontend
        run: |
          npm test

      - name: Build frontend
        working-directory: codebase/frontend
        run: |
          npm run build
